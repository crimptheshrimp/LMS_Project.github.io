<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- App Icon: knockout on Ink Pine background (96×96) -->
  <rect width="96" height="96" rx="20" fill="#10262B"/>
  
  <!-- Left stem with a shortened inward curl -->
  <path d="M 33 9 L 33 58 Q 33 67 41 72 Q 48 77 56 72" stroke="#FAF8F5" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-miterlimit="10"/>
  
  <!-- S-curve crossbar -->
  <path d="M 33 33 Q 48 21 63 33" stroke="#FAF8F5" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-miterlimit="10"/>
  
  <!-- Right stem is shortened to about two-thirds while keeping the top anchored -->
  <path d="M 63 9 L 63 58" stroke="#FAF8F5" stroke-width="6.75" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-miterlimit="10"/>
  
  <!-- Saffron node on the left curl -->
  <circle cx="59" cy="72" r="4.8" fill="#E9A13B"/>
</svg>
